[project]
name = "provider-neutral-mail-edge-mailgun"
version = "0.1.0"
description = "Provider-neutral Mailgun adapters for the mail edge"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_edge"]
