name: Mail edge formal model

on:
  pull_request:
    paths:
      - "formal/mail-edge/**"
      - ".github/workflows/mail-edge-formal.yml"
  push:
    branches:
      - "test/mail-edge-formal-model"
    paths:
      - "formal/mail-edge/**"
      - ".github/workflows/mail-edge-formal.yml"

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check safety, liveness, and counterexample regressions
        env:
          TLC_RUNTIME: docker
        run: make -C formal/mail-edge ci
