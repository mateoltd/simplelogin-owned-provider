format_version = 1
bundle_format = "simplelogin-owned-provider-compliance"
bundle_format_version = 1
cyclonedx_spec_version = "1.6"

[provenance]
fork_source_url = "https://github.com/mateoltd/simplelogin-owned-provider"
upstream_source_url = "https://github.com/simple-login/app"
license_expression = "AGPL-3.0-only"

[obligations]
source_license_families = ["AGPL", "GPL", "LGPL", "MPL", "EPL", "CDDL"]
relink_license_families = ["LGPL"]
allowed_license_refs = ["LicenseRef-psycopg2-OpenSSL-exception"]
allowed_license_ids = [
  "0BSD",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Artistic-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-4-Clause",
  "BlueOak-1.0.0",
  "BSL-1.0",
  "CC-BY-3.0",
  "CC-BY-4.0",
  "CC0-1.0",
  "CDDL-1.0",
  "EPL-1.0",
  "EPL-2.0",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.0-only",
  "LGPL-2.0-or-later",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-1.1",
  "MPL-2.0",
  "OFL-1.1",
  "OpenSSL",
  "PHP-3.01",
  "PostgreSQL",
  "PSF-2.0",
  "Python-2.0",
  "Ruby",
  "Unicode-3.0",
  "Unlicense",
  "WTFPL",
  "Zlib",
]
allowed_license_exceptions = [
  "Classpath-exception-2.0",
  "GCC-exception-3.1",
  "OpenSSL-exception",
]
static_relink_material_kinds = ["object", "link-script", "instructions"]
dynamic_relink_material_kinds = ["source", "instructions"]
interpreted_relink_material_kinds = ["source", "instructions"]

[runtime]
forbidden_python_distributions = [
  "astroid",
  "black",
  "djlint",
  "cython",
  "pip",
  "pip-audit",
  "pylint",
  "pytest",
  "ruff",
  "setuptools",
  "tqdm",
  "virtualenv",
  "wheel",
]
forbidden_executables = [
  "2to3",
  "2to3-3.12",
  "ar",
  "as",
  "cc",
  "clang",
  "cmake",
  "cargo",
  "c++",
  "g++",
  "gcc",
  "git",
  "idle3",
  "idle3.12",
  "ld",
  "make",
  "ninja",
  "npm",
  "pip",
  "pip3",
  "pip3.12",
  "pkg-config",
  "pydoc3",
  "pydoc3.12",
  "python3-config",
  "python3.12-config",
  "uv",
  "uvx",
  "rustc",
  "wheel",
]
forbidden_debian_packages = [
  "binutils",
  "build-essential",
  "cargo",
  "clang",
  "cmake",
  "gcc",
  "git",
  "libre2-dev",
  "make",
  "ninja-build",
  "pkg-config",
  "python3-dev",
  "rustc",
]
forbidden_debian_suffixes = ["-dev", "-dbg", "-dbgsym"]

[external_images]
postgres = "referenced-not-conveyed"
redis = "referenced-not-conveyed"
mailpit = "referenced-not-conveyed"
mail_edge = "external-contract-not-conveyed"
