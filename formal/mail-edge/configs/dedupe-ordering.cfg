CONSTANTS
    DomainCount = 1
    GenerationCount = 1
    IngressCount = 1
    DeliveryCount = 1
    EventCount = 3
    IncludeUnknownItems = FALSE
    IncludeUnknownEvent = FALSE
    MaxCrashes = 1
    MaxRetries = 0
    AllowAmbiguity = TRUE

SPECIFICATION Spec
