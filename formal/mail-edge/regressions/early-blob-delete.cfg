CONSTANTS
    DomainCount = 1
    GenerationCount = 1
    IngressCount = 1
    DeliveryCount = 1
    EventCount = 1
    IncludeUnknownItems = FALSE
    IncludeUnknownEvent = FALSE
    MaxCrashes = 0
    MaxRetries = 0
    AllowAmbiguity = FALSE
    Regression = "early-blob-delete"

SPECIFICATION RegressionSpec
CHECK_DEADLOCK FALSE
INVARIANT QueuedBytesRetainedUntilDefinitiveDisposition
