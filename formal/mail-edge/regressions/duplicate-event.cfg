CONSTANTS
    DomainCount = 1
    GenerationCount = 1
    IngressCount = 1
    DeliveryCount = 1
    EventCount = 3
    IncludeUnknownItems = FALSE
    IncludeUnknownEvent = FALSE
    MaxCrashes = 0
    MaxRetries = 0
    AllowAmbiguity = FALSE
    Regression = "duplicate-event"

SPECIFICATION RegressionSpec
CHECK_DEADLOCK FALSE
INVARIANT ProviderEventAppliedAtMostOnce
