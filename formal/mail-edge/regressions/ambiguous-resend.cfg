CONSTANTS
    DomainCount = 1
    GenerationCount = 1
    IngressCount = 1
    DeliveryCount = 1
    EventCount = 1
    IncludeUnknownItems = FALSE
    IncludeUnknownEvent = FALSE
    MaxCrashes = 0
    MaxRetries = 0
    AllowAmbiguity = TRUE
    Regression = "ambiguous-resend"

SPECIFICATION RegressionSpec
CHECK_DEADLOCK FALSE
INVARIANT AmbiguousSendIsNeverResentOrRerouted
